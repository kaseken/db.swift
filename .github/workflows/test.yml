name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Swift Test
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Swift via swiftly
        run: |
          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$HOME/.swiftly" >> "$GITHUB_ENV"
          ~/.swiftly/bin/swiftly install 6.3.2 --use
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test --enable-code-coverage
      - name: Generate coverage report
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          LLVM_COV="$(swift -print-target-info | grep runtimeResourcePath | sed 's|.*"\(.*\)/lib/swift.*"|\1|')/bin/llvm-cov"
          "${LLVM_COV}" report \
            "${BIN_PATH}/db_tutorial_swiftPackageTests.xctest/Contents/MacOS/db_tutorial_swiftPackageTests" \
            --instr-profile "${BIN_PATH}/codecov/default.profdata" \
            --ignore-filename-regex='\.build|Tests' \
            | tee coverage.txt
          printf '## Coverage\n```\n%s\n```\n' "$(cat coverage.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(printf '## Coverage\n```\n%s\n```' "$(cat coverage.txt)")
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## Coverage"))) | .id' \
            | tail -1)
          if [ -n "${COMMENT_ID}" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              --method PATCH --field body="${BODY}"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "${BODY}"
          fi
