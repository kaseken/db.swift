name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Swift Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test
